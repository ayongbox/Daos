spring:
  datasource:
    # 默认文件库，重启保留；生产可用 DAOS_DB_URL 指向 PostgreSQL
    url: ${DAOS_DB_URL:jdbc:h2:file:./data/daos;AUTO_SERVER=TRUE}
    driver-class-name: ${DAOS_DB_DRIVER:org.h2.Driver}
    username: ${DAOS_DB_USERNAME:sa}
    password: ${DAOS_DB_PASSWORD:}

baseon:
  web:
    user-context:
      # Daos 直连部署，禁止用可伪造的请求头注入登录态；身份只来自会话拦截器
      enabled: false

daos:
  auth:
    # 首次启动创建引导账号；三项齐全才创建，已存在则忽略
    bootstrap-tenant: ${DAOS_BOOTSTRAP_TENANT:}
    bootstrap-username: ${DAOS_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${DAOS_BOOTSTRAP_PASSWORD:}
  file:
    storage: local
    local-root: ./data/files
    max-size: 20971520
    signed-url-ttl: 5m
    # 生产与多实例必须显式配置；留空则启动时生成临时密钥
    download-secret: ${DAOS_FILE_DOWNLOAD_SECRET:}
